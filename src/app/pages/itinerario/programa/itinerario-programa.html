<div class="pagina__grid">
  @for (tramo of tramos; track tramo.codigo) {
    <article class="tarjeta-tramo programa__tarjeta">
      <div class="tarjeta-tramo__cabecera">
        <div>
          <p class="tarjeta-tramo__codigo numero-tabular">{{ tramo.codigo }}</p>
          <h2 class="tarjeta-tramo__titulo">{{ tramo.nombre }}</h2>
        </div>
        <span class="tarjeta-tramo__estado">{{ tramo.estado }}</span>
      </div>

      <div class="tarjeta-tramo__metricas">
        <div>
          <p class="tarjeta-tramo__etiqueta">DISTANCIA</p>
          <p class="tarjeta-tramo__dato">{{ tramo.distancia }}</p>
        </div>
        <div>
          <p class="tarjeta-tramo__etiqueta">MEDIA</p>
          <p class="tarjeta-tramo__dato">{{ tramo.media }}</p>
        </div>
        <div>
          <p class="tarjeta-tramo__etiqueta">CONTROLES</p>
          <p class="tarjeta-tramo__dato">{{ tramo.controles }}</p>
        </div>
      </div>
    </article>
  }
</div>
