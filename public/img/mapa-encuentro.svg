<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Plano esquemático del punto de encuentro en San Lorenzo de El Escorial">
  <rect width="800" height="440" fill="#EEE8DC" />
  <g stroke="#141816" stroke-opacity="0.14" stroke-width="1">
    <line x1="0" y1="88" x2="800" y2="88" />
    <line x1="0" y1="176" x2="800" y2="176" />
    <line x1="0" y1="264" x2="800" y2="264" />
    <line x1="0" y1="352" x2="800" y2="352" />
    <line x1="160" y1="0" x2="160" y2="440" />
    <line x1="320" y1="0" x2="320" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="640" y1="0" x2="640" y2="440" />
  </g>
  <!-- Carretera de acceso M-505 y vía hacia Cruz Verde -->
  <path d="M 40 360 Q 220 290 390 220 T 740 110" fill="none" stroke="#1F3B2D" stroke-width="8" stroke-linecap="round" />
  <path d="M 40 360 Q 220 290 390 220 T 740 110" fill="none" stroke="#EEE8DC" stroke-width="1.5" stroke-dasharray="10 8" />
  <path d="M 390 220 Q 470 300 660 370" fill="none" stroke="#A36A3A" stroke-width="5" stroke-linecap="round" />
  <!-- Zona Parque Cerrado -->
  <rect x="330" y="168" width="120" height="84" rx="4" fill="#1F3B2D" fill-opacity="0.14" stroke="#1F3B2D" stroke-width="2" />
  <circle cx="390" cy="210" r="14" fill="#6B1F2A" stroke="#EEE8DC" stroke-width="3" />
  <circle cx="390" cy="210" r="4" fill="#EEE8DC" />
  <!-- Rosa de los vientos -->
  <g transform="translate(715 70)" stroke="#141816" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="24" fill="#EEE8DC" />
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#6B1F2A" stroke="none" />
    <polygon points="0,18 5,0 0,4 -5,0" fill="#141816" stroke="none" />
    <text x="0" y="-29" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#141816" stroke="none">N</text>
  </g>
  <!-- Etiquetas cartográficas -->
  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#141816">
    <text x="390" y="152" text-anchor="middle">PARQUE CERRADO · SALIDA OFICIAL</text>
    <text x="145" y="340">ACCESO M-505</text>
    <text x="640" y="96" text-anchor="middle">HACIA TC-01 CRUZ VERDE</text>
    <text x="580" y="395" text-anchor="middle">ZONA DE ASISTENCIA</text>
  </g>
</svg>
