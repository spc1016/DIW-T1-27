  <!-- Puntos de etapa -->
  <circle cx="90" cy="310" r="11" fill="#141816" stroke="#EEE8DC" stroke-width="2.5" />
  <circle cx="240" cy="245" r="12" fill="#1F3B2D" stroke="#EEE8DC" stroke-width="2.5" />
  <circle cx="430" cy="140" r="13" fill="#6B1F2A" stroke="#EEE8DC" stroke-width="3" />
